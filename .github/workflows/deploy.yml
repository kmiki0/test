name: Deploy to GitHub Pages

# GitHub Pages 用のデプロイ。
# main または開発ブランチへの push で自動ビルド＆公開する。
# 手動実行（Actions タブの Run workflow）も可能。
# ※ Pages を使うにはリポジトリが Public（無料プランの場合）かつ
#    Settings → Pages → Source: GitHub Actions である必要がある。
on:
  push:
    branches:
      - main
      - claude/practical-wozniak-HmGKq
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開デプロイは同時に1つだけ実行する。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
