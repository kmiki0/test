name: Deploy to GitHub Pages

# GitHub Pages 用のデプロイ。
# ※ このリポジトリは Private のため無料プランでは Pages を公開できない。
#    通常は Cloudflare Pages を使うため、本ワークフローは手動実行のみにしている。
#    Public 化して GitHub Pages を使う場合は push トリガーを復活させる。
on:
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開デプロイは同時に1つだけ実行する。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
